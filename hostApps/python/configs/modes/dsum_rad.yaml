behavior:
  export_h5: true                       # Bool - Create an H5 file
  clear_hexread: true                   # Bool - run clearHexRead() on session startup
  power_supplies: true                  # Bool - Initialize power supplies automatically
  per_pdc_pixel_off: true               # Bool - Use manual pdc masking defined in run.yaml
  allow_analog_only: true               # Bool - Allow analog only mode
  pdc_pix_dis_args: "--mode NONE"       # Str  - Argument to append to the end of pdcPix --dis command

pdc:
  time: {hold_ns: 250.0, rech_ns: 10.0, flag_ns: 2.0}   # pdcTime command: hold, recharge and flag times in ns
  PIXL:
    active_qc_en: 1      # active quenching enabled
    trg_dgtl_fen: 0      
    flag_en: 1           # flag output enabled
    edge_lvln: 1         
    dis_mem: 1           
  ANLG: 0x0001           # analog monitor select, 0x0000 = off
  STHL:
    enable: 1            # enables both sum thresholds (STHH and STHL)
    low: 6               # low sum threshold value
  FIFO:
    overwrite_dis: 0     # 1 = do not overwrite old FIFO entries
    enable: 1            # FIFO enabled
    sel_in: 0            # FIFO input: 0 digital sum, 1 debug counter, 2 debug register, 3 zeros
    depth: auto          # bins - 1; auto = fsm.samples n_fast + n_slow - 1
  OUTD: {func: DATA}     
  OUTF: {func: SUM_GT}   
  TRGC: 0x0000           # trigger command, 0x0000 = disabled
  OUTC: {data: CFG_VALID, flag: CLK_CS}   # config pin functions; written last, after validPdcCfg

controller:
  packet:
    SCSA: {pdc_status_all: 1}   # config/status words in packet A; always written first so the other registers get stored in the HDF5
    SCDA: {gbl_ctl_tdc: 1}      # Controller data in packet A: gbl_ctl_tdc (rad only; coincidence leaves this empty)
    SPDA: {preset: dsum}        # PDC data in packet A; dsum preset = digital sum only
  fsm:
    samples:
      n_fast: 0                 # samples in the fast acquisition state
      n_slow: 128               # samples in the slow state
      n_history: 28             # samples kept from before the trigger; state delay = n - n_history
    trigger_mode: 5             # mode field of the active acquisition state (SLW0, or FST0 if n_fast > 0); coincidence uses 1
    slow_period: 0              # SLW1 period
    timeout: {auto: 0, all_pdc: 1, retry: 1, period: 48}   # TOUT register
    end:  {enable: 1, mode: 2, delay: 0}                   # FEND: end of acquisition state
    tx:   {enable: 1, cmd_mode: 1, mode: 2, cmd_delay: 0, cancel_send_rstn: 0, cancel_mode: 0}   # FTX0 / FTX1: transmit state; its n is n_fast + n_slow
    atx:  {enable: 0, mode: 0, cmd_mode: 0, cmd_delay: 0, cancel_send_rstn: 0, cancel_mode: 0, n: 0}   # ATX0 / ATX1; disabled
    acq:  {cancel_send_rstn: 0, cancel_mode: 0, overlap: 0, cmd_mode: 7}   # FACQ: acquisition command options
    misc: {tx_all_pdc: 1, acq_all_pdc: 1}   # FSMM: apply tx and acq to all PDCs
  interfaces:                   # rad only; this group is empty in coincidence
    ITF2: {sum_th_acq: 1}       # input interface for SUM_TH and CLK_TX; sum_th_acq routes SUM_TH to the acq state
  coincidence: {window: 1, nch_th: 1, num_bank: 1}   # COIW window (clock cycles); COTH nch_th = PDCs that must hit in the window, num_bank = bank count (names)
  apps:
    stream_manager: {tlast_threshold: 500, timeout_s: 1}   # streamManager --thresh <tlast_threshold> -T <timeout_s> --sec
    strobe_timer_freq: "10e3"   # set-ctl-tmr-prd FREQ=<value>; quoted so it is passed as text; rad only
    aux_out:
      - {channel: 0, func: 23, n: 0}   # auxOut --ch 0 --func 23 -n 0; n is auxOut's optional -n argument
      - {channel: 1, func: 23, n: 0}   # same function on channel 1
    aux_in:
      - {func: 0, channel: 2}          # auxIn --func 0 --channel 2; rad only
